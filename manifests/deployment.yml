apiVersion : apps/v1
kind: Deployment
metadata:
  name: dotnetappkubernetes 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnetappkubernetes
  template:
    metadata:
      labels:
        app: dotnetappkubernetes 
    spec:
      containers:
        - name: dotnetappkubernetes 
          image: bycentineldotnetregistry.azurecr.io/dotnetappkubernetes
          ports:
          - containerPort: 80