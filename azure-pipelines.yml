trigger:
- main

pool:
  # vmImage: 'windows-latest'
  name: 'localDesktopMachine'

variables:
  solution: 'dotnet-app-mvc.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  outputDir: '$(build.artifactStagingDirectory)'
  defaultDir: '$(System.DefaultWorkingDirectory)'
  sonarOrganization: 'az-devops-team'
  sonarProjectKey: 'az-devops-team_dotnet-app-mvc'
  sonarProjectName: 'dotnet-app-mvc'


stages:
  # build dotnet app mvc
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: BuildNetCoreApp
        displayName: Build .Net Core app
        steps:

          # install dotnet v8
          - task: UseDotNet@2
            displayName: 'Install .net core v8'
            inputs:
              packageType: 'sdk'
              version: '8.0.424'

          # sonarcloud
          - task: SonarCloudPrepare@4
            displayName: 'Prepare analysis Configuration on SonarCloud'
            inputs:
              SonarCloud: 'az-sonarcloud'
              organization: '$(sonarOrganization)'
              scannerMode: 'dotnet'
              projectName: '$(sonarProjectName)'
              projectKey: '$(sonarProjectKey)'

          # dotnet restore
          - task: DotNetCoreCLI@2
            displayName: 'Restore Dependencies'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # dotnet build
          - task: DotNetCoreCLI@2
            displayName: 'Build Proyect'
            inputs:
              command: 'build'
              projects: '$(solution)'

          # sonarcloud run analysis
          - task: SonarCloudAnalyze@4
            displayName: 'Run code analysis on SonarCloud'
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          # sonarcloud publish
          - task: SonarCloudPublish@4
            displayName: 'Publish quality gate result on SonarCloud'
            inputs:
              pollingTimeoutSec: '300'

          # dotnet publish
          - task: DotNetCoreCLI@2
            displayName: 'Create dotnet-app-core.zip'
            inputs:
              command: 'publish'
              publishWebProjects: true
              arguments: '--configuration $(buildConfiguration) --output $(outputDir)'

          # publish build artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish dotnet-app-core.zip'
            inputs:
              PathtoPublish: '$(outputDir)'
              ArtifactName: 'drop'
              # publishLocation: 'Container'

          # notification successfully!
          - script: echo Build completed successfully!!!
            displayName: 'Notification, Build Status'

  - stage: Deploy
    displayName: Deploy Stage
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Deploy to Azure App Service'
        steps:
          - task: DownloadBuildArtifacts@1
            displayName: 'Download Artifact (dotnet-app-core.zip) from drop folder'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(defaultDir)'

          - task: AzureRmWebAppDeployment@5
            displayName: 'Deploy in Azure App Service'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'azsubscription'
              appType: 'webApp'
              WebAppName: 'dotnet-core-app'
              deployToSlotOrASE: true
              ResourceGroupName: 'bycentinel-example-group'
              SlotName: 'production'
              packageForLinux: '$(defaultDir)/**/*.zip'

          - script: echo Deployment to Azure App Service completed!
            displayName: 'Notification, Deployment Status'